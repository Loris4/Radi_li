# Radi li? – korak 5: + raspoređivač i otkucaji sondi
#
# Pokretanje:   docker compose up -d --build
# Gašenje:      docker compose down
# Brisanje baze i redova: docker compose down -v
# Dodatna sonda (Osijek) za demonstraciju: docker compose --profile dodatne up -d sonda-d

# Zajedničke postavke svih sondi (YAML sidro, da se ne ponavljamo).
# Svaka sonda glumi drugu lokaciju; razlikuju se samo SONDA_ID i LOKACIJA.
x-sonda: &sonda
  build: ./sonda
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  environment: &sonda-env
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    # Popis servisa sonda dobiva od raspoređivača (kroz RabbitMQ).
    ISTEK_S: "5"
    OTKUCAJ_S: "10"

services:

  # Prati otkucaje sondi i dodjeljuje svaki servis trima sondama.
  # Stanje sondi: http://localhost:8401/sonde   Raspored: http://localhost:8401/raspored
  # Radi kao JEDNA instanca (bez --scale); ako padne, sonde nastavljaju po starom rasporedu.
  rasporedivac:
    build: ./rasporedivac
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      baza:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@baza:5432/${POSTGRES_DB}
      KONFIGURACIJA_URL: http://konfiguracija:8000
      OTKUCAJ_S: "10"
      KASNI_S: "15"
      ISPALA_S: "30"
    ports:
      - "8401:8000"

  # Vlasnik popisa servisa. Sučelje za ručno isprobavanje: http://localhost:8301/docs
  konfiguracija:
    build: ./konfiguracija
    restart: unless-stopped
    depends_on:
      baza:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@baza:5432/${POSTGRES_DB}
    ports:
      - "8301:8000"

  sonda-a:
    <<: *sonda
    environment:
      <<: *sonda-env
      SONDA_ID: sonda-a
      LOKACIJA: Pula

  sonda-b:
    <<: *sonda
    environment:
      <<: *sonda-env
      SONDA_ID: sonda-b
      LOKACIJA: Rijeka

  sonda-c:
    <<: *sonda
    environment:
      <<: *sonda-env
      SONDA_ID: sonda-c
      LOKACIJA: Zagreb

  # Ne pokreće se sama; služi za demonstraciju dolaska nove sonde:
  #   docker compose --profile dodatne up -d sonda-d
  sonda-d:
    <<: *sonda
    profiles: ["dodatne"]
    environment:
      <<: *sonda-env
      SONDA_ID: sonda-d
      LOKACIJA: Osijek

  # Čita rezultate iz reda rezultati.prihvat i sprema ih u bazu.
  # Nema vlastito stanje, pa se može skalirati:
  #   docker compose up -d --scale prihvat=3
  # Port na računalu Docker svakoj replici dodjeljuje sam (slobodan port).
  # Koji je to port, vidi se naredbom: docker compose ps prihvat
  prihvat:
    build: ./prihvat
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      baza:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@baza:5432/${POSTGRES_DB}
    ports:
      - "8000"


  # Red poruka. Na http://localhost:15672 je web-sučelje (korisnik/lozinka iz .env).
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"     # AMQP – preko ovoga razgovaraju naše usluge
      - "15672:15672"   # web-sučelje za upravljanje
    volumes:
      - rabbitmq_podaci:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Baza za servise, rezultate provjera i incidente.
  baza:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - baza_podaci:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Testni servisi: "lažni" e-Građani, Studomat i Merlin koje možemo
  # po volji ugasiti ili usporiti. Na njima testiramo cijeli sustav,
  # da ne opterećujemo prave javne servise.
  testni-egradani:
    build: ./testni-servis
    environment:
      IME_SERVISA: e-Građani (testni)
    ports:
      - "8101:8000"

  testni-studomat:
    build: ./testni-servis
    environment:
      IME_SERVISA: Studomat (testni)
    ports:
      - "8102:8000"

  testni-merlin:
    build: ./testni-servis
    environment:
      IME_SERVISA: Merlin (testni)
    ports:
      - "8103:8000"

volumes:
  rabbitmq_podaci:
  baza_podaci:
